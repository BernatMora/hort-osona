<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="Il·lustració d'un brot de romaní">
  <defs>
    <radialGradient id="romani-bg" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#F5EBD8"/>
      <stop offset="100%" stop-color="#D9D0B5"/>
    </radialGradient>
        <linearGradient id="romani-skin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7A8A4A"/>
      <stop offset="100%" stop-color="#4A5A2A"/>
    </linearGradient>

    <linearGradient id="romani-leaves" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7BA05B"/>
      <stop offset="100%" stop-color="#3D4A2A"/>
    </linearGradient>
  </defs>

  <rect width="200" height="200" fill="url(#romani-bg)" rx="12"/>

  <!-- Terra -->
  <ellipse cx="100" cy="152" rx="58" ry="8" fill="#8B6F47" opacity="0.5"/>
  <!-- Brot llenyós vertical -->
  <g transform="rotate(6 100 110)">
    <path d="M 100 160 C 98 130 100 100 100 56" stroke="url(#romani-skin)" stroke-width="3.4" fill="none"/>
    <!-- Fulles agulles (parells alterns) -->
    <g stroke="#6B8A4A" stroke-width="2.6" stroke-linecap="round">
      <path d="M 100 62 L 88 54 M 100 62 L 112 54"/>
      <path d="M 100 78 L 86 72 M 100 78 L 114 72"/>
      <path d="M 100 94 L 85 90 M 100 94 L 115 90"/>
      <path d="M 100 110 L 85 108 M 100 110 L 115 108"/>
      <path d="M 100 126 L 86 126 M 100 126 L 114 126"/>
      <path d="M 100 142 L 88 146 M 100 142 L 112 146"/>
    </g>
    <!-- Florcines blaves -->
    <g fill="#8FA6D9">
      <ellipse cx="86" cy="50" rx="2.4" ry="3.6" transform="rotate(-30 86 50)"/>
      <ellipse cx="114" cy="48" rx="2.4" ry="3.6" transform="rotate(24 114 48)"/>
      <ellipse cx="108" cy="66" rx="2.2" ry="3.4" transform="rotate(40 108 66)"/>
      <ellipse cx="92" cy="68" rx="2.2" ry="3.4" transform="rotate(-40 92 68)"/>
    </g>
  </g>
</svg>
