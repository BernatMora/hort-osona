  </defs>

  <rect width="200" height="200" fill="url(#patata-bg)" rx="12"/>

  <!-- Terra -->
  <ellipse cx="100" cy="152" rx="58" ry="8" fill="#8B6F47" opacity="0.5"/>
  <!-- Tubercles -->
