      <circle cx="84" cy="138" r="1.6"/>
      <circle cx="94" cy="132" r="1.6"/>
    </g>
  </g>
  <g transform="rotate(14 124 140) scale(0.72)" transform-origin="130 150">
    <path d="M 124 122 C 110 122 104 134 106 148 C 108 160 116 166 124 166 C 132 166 140 160 142 148 C 144 134 138 122 124 122 Z" fill="url(#patata-skin)"/>
    <circle cx="118" cy="138" r="1.6" fill="#8F7420" opacity="0.7"/>
    <circle cx="130" cy="146" r="1.6" fill="#8F7420" opacity="0.7"/>
  </g>
  <!-- Planta -->
  <g stroke="#5C7135" stroke-width="2.4" fill="none">
    <path d="M 76 104 C 74 88 76 72 84 58"/>
    <path d="M 92 102 C 96 86 102 72 106 56"/>
  </g>
  <g fill="url(#patata-leaves)">
    <path d="M 84 58 C 72 54 66 42 74 34 C 84 30 92 40 88 52 Z"/>
    <path d="M 106 56 C 118 52 124 44 116 36 C 106 32 98 42 102 52 Z" opacity="0.92"/>
