<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="Il·lustració d'una beina de pèsol">
  <defs>
    <radialGradient id="pesol-bg" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#F5EBD8"/>
      <stop offset="100%" stop-color="#D9D0B5"/>
    </radialGradient>
        <linearGradient id="pesol-skin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7FA24A"/>
      <stop offset="100%" stop-color="#4A6B2A"/>
    </linearGradient>

    <linearGradient id="pesol-leaves" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7BA05B"/>
      <stop offset="100%" stop-color="#3D4A2A"/>
    </linearGradient>
  </defs>

  <rect width="200" height="200" fill="url(#pesol-bg)" rx="12"/>

  <!-- Terra -->
  <ellipse cx="100" cy="152" rx="58" ry="8" fill="#8B6F47" opacity="0.5"/>
  <g transform="rotate(-18 100 112)">
    <path d="M 56 96 C 70 84 106 80 142 92 C 146 94 146 102 142 106 C 106 118 70 114 56 100 C 54 98 54 97 56 96 Z" fill="url(#pesol-skin)"/>
    <path d="M 60 98 C 76 90 112 87 140 94" stroke="#3A5423" stroke-width="1.3" fill="none" opacity="0.6"/>
    <!-- Pèsols en relleu -->
    <g fill="#96B85E" stroke="#4A6B2A" stroke-width="0.8">
      <circle cx="80" cy="99" r="5.2"/>
      <circle cx="96" cy="98" r="5.2"/>
      <circle cx="112" cy="98" r="5.2"/>
      <circle cx="128" cy="98" r="5.2"/>
    </g>
    <!-- Boca i tija -->
    <path d="M 142 92 C 150 90 154 94 152 99 C 151 103 147 105 143 104" stroke="#4A6B2A" stroke-width="2" fill="none"/>
    <path d="M 56 98 C 50 98 46 95 44 90" stroke="#4A6B2A" stroke-width="2" fill="none"/>
  </g>
  <!-- Cirrus (circells) -->
  <g stroke="#7FA24A" stroke-width="1.8" fill="none">
    <path d="M 136 84 C 144 78 150 82 146 88 C 143 92 138 89 141 85"/>
    <path d="M 62 88 C 56 80 58 74 64 74 C 69 74 68 80 64 80"/>
  </g>
  <!-- Fulla de pèsol -->
  <path d="M 70 72 C 58 66 54 52 64 46 C 74 42 82 52 76 64 Z" fill="url(#pesol-leaves)"/>
</svg>
